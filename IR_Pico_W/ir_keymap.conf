#
# Remote: General Electric Universal Remote model RC-G016
# MODE: Blu-Ray,  Code: 1161, Address: 0x0038
#
PWR:0x12                # Quit program
REW:0x1f                # Seek backward in video
FWD:0x1e                # Seek forward in video
PLAY_NEXT:0x4e          # Play next video
PLAY_PREV:0x4f          # Play previous video
PLAY_PAUSE:0x54         # Pause/play
SPEED+:0xa              # Increase playback speed
SPEED-:0xb              # Decrease playback speed
VOL+:0xe                # Increase volume
VOL-:0xf                # Decrease volume
MUTE-UNMUTE:0x18        # Mute/unmute
LOOP:0x3c               # Loop single video
SCREENSHOT:0xc          # Screenshot
SCRNSHOT:0xff           # Screenshot
FILTER:0x24             # Play/Pause button at top. Filter Model ('F') Sub Playlists
SHUFFLE:0x32            # app3 button.  Toggle Shuffle/Sort playlist
RESTART:0x19            # Restart video to beginning
MENU:0x4c               # Menu - Remote control Help box
HUD:0x25                # Square key. Brings up the HUD.
# A,B,C,D Buttons are reserved for the menu system.
A:0x22                  # 'A' button - Menu_A
B:0x23                  # 'B' button - Menu_B
C:0x20                  # 'C' button - Menu_C
D:0x21                  # 'D' button - Menu_D
# Number buttons 0-9
0:0x0                   # 0 button
1:0x1                   # 1 button
2:0x2                   # 2 button
3:0x3                   # 3 button
4:0x4                   # 4 button
5:0x5                   # 5 button
6:0x6                   # 6 button
7:0x7                   # 7 button
8:0x8                   # 8 button
9:0x9                   # 9 button
#
# NOTE: It is VERBOTEN to assign callbacks to any numeral keys
#
# Need to add the following to a menu:
#
# Toggle OSD (3 states)
# Load a Playlist
# Save Current Master playlist
# Print Currently active playlist
# Shuffle/Sort Master Playlist
#


